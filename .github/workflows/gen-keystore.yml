name: Generate signing key

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        run: |
          keytool -genkeypair -v \
            -keystore chess.keystore \
            -alias chess \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass chess123 -keypass chess123 \
            -dname "CN=Chess Family App, OU=Home, O=Home, L=Moscow, ST=Moscow, C=RU"
          keytool -list -keystore chess.keystore -storepass chess123

      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: chess.keystore
