name: Build APK
on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle-8.9-bin.zip
          unzip -q /tmp/gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
      - name: Verify Gradle installation
        run: |
          echo "PATH: $PATH"
          /opt/gradle-8.9/bin/gradle --version
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools build-tools;34.0.0 platforms;android-34
      - name: Accept Android SDK licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
      - name: Generate Gradle wrapper
        run: /opt/gradle-8.9/bin/gradle wrapper
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew assembleDebug
      - name: Verify signing certificate
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | tee /tmp/cert.txt
          echo "### Подпись" >> $GITHUB_STEP_SUMMARY
          grep -i "SHA-256" /tmp/cert.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk